serverName                ols-e2e
user                      nobody
group                     nogroup
priority                  0
autoRestart               1
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
adminEmails               root@localhost
indexFiles                index.html

errorlog logs/error.log {
  logLevel                INFO
  debugLevel              0
  rollingSize             10M
  enableStderrLog         1
}

accesslog logs/access.log {
  rollingSize             10M
  keepDays                2
  compressArchive         0
}

# Backend-driven caching: enableCache 0 + checkPublicCache 1 means only
# responses carrying X-LiteSpeed-Cache-Control: public,... are cached.
module cache {
  internal                1
  checkPrivateCache       0
  checkPublicCache        1
  maxCacheObjSize         10000000
  maxStaleAge             200
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  enableCache             0
  expireInSeconds         3600
  enablePrivateCache      0
  privateExpireInSeconds  3600
  storagepath             /tmp/lscache
  ls_enabled              1
}

extprocessor app {
  type                    proxy
  address                 app-ols:8000
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

virtualhost demo {
  vhRoot                  /var/www/vhosts/demo
  configFile              conf/vhosts/demo/vhconf.conf
  allowSymbolLink         1
  enableScript            0
  restrained              0
}

listener HTTP {
  address                 *:80
  secure                  0
  map                     demo *
}
