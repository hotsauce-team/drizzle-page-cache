# Bench-only pairing: Envoy with the (alpha) HTTP cache filter and a TLS
# listener. Caching is driven by the app's Cache-Control (RFC 7234 —
# s-maxage honored, no-store bypassed). Note: the cache filter has NO purge
# mechanism of any kind — bench-only by necessity, not choice.
# Envoy uses all cores by default (--concurrency = hw threads).

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 80 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: HTTP1
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: app }
                http_filters:
                  - name: envoy.filters.http.cache
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cache.v3.CacheConfig
                      # Without this, ANY response bearing a Vary header is
                      # uncacheable (default allowlist is empty) — and many
                      # runtimes (Deno.serve included) add
                      # "Vary: Accept-Encoding" automatically. See BENCHMARKS.md.
                      allowed_vary_headers:
                        - exact: "accept-encoding"
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.http.cache.simple_http_cache.v3.SimpleHttpCacheConfig
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: https
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              # Full handshakes for the TLS bench: no tickets, no session cache.
              disable_stateless_session_resumption: true
              session_timeout: 0s
              common_tls_context:
                alpn_protocols: ["http/1.1"]
                tls_certificates:
                  - certificate_chain: { filename: /certs/cert.pem }
                    private_key: { filename: /certs/key.pem }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: HTTP1
                route_config:
                  name: local_tls
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: app }
                http_filters:
                  - name: envoy.filters.http.cache
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cache.v3.CacheConfig
                      # Without this, ANY response bearing a Vary header is
                      # uncacheable (default allowlist is empty) — and many
                      # runtimes (Deno.serve included) add
                      # "Vary: Accept-Encoding" automatically. See BENCHMARKS.md.
                      allowed_vary_headers:
                        - exact: "accept-encoding"
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.http.cache.simple_http_cache.v3.SimpleHttpCacheConfig
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: app
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: app, port_value: 8000 }
