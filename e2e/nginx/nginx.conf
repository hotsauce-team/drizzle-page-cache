# Bench-only pairing: nginx has no tag-based purging, it's here as the
# throughput/CPU reference. Tuning: all cores, cache on tmpfs (/dev/shm),
# upstream keepalive, high client keepalive, logs off.
worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;

  # In-memory storage: /dev/shm is tmpfs (see shm_size in docker-compose.yml).
  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=10m;

  upstream app_upstream {
    server app:8000;
    keepalive 32;
  }

  server {
    listen 80;
    # TLS listener for the handshake-stress bench: HTTP/1.1 only (no `http2`
    # — ALPN/h2 would confound the comparison), resumption fully disabled so
    # every connection pays a FULL handshake.
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_requests 100000;

    # Known-uncacheable prefix gets a cache-free location. Without this,
    # proxy_cache_lock + a no-store response = waiting requests stall for
    # proxy_cache_lock_timeout (5 s default) — measured; see SPEC bench notes.
    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://app_upstream;
    }

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      # No proxy_cache_valid: the app's `s-maxage` drives freshness.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_pass http://app_upstream;
    }
  }
}
