# nginx pairing: tag purging via the Lua helper (see nginx/purge.lua at
# the repo root, mounted at /dpc). No purge module: the Lua log phase
# records each cache key's Surrogate-Key tags in a shared dict, purges
# enter through the dedicated /__dpc/ endpoint (Fastly-shaped routes), and
# requests whose recorded tags were purged set $skip_cache for
# proxy_cache_bypass until refreshed.
# Tuning matches the other pairings: all cores, cache on tmpfs (/dev/shm),
# upstream keepalive, high client keepalive, logs off.
load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;
events {
  worker_connections 8192;
}

http {
  access_log off;

  # In-memory storage: /dev/shm is tmpfs (see shm_size in docker-compose.yml).
  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=10m;

  # Purge state for nginx/purge.lua. dpc_tags must not evict (an evicted
  # purge record can serve stale — size generously; marks self-size from
  # each purge's X-DPC-Mark-TTL header, 30 days when absent);
  # dpc_keys eviction only costs an extra bypass.
  lua_shared_dict dpc_tags 4m;
  lua_shared_dict dpc_keys 16m;
  lua_package_path "/dpc/?.lua;;";

  upstream app_upstream {
    server app-nginx:8000;
    keepalive 32;
  }

  server {
    listen 80;
    # TLS listener for the handshake-stress bench: HTTP/1.1 only (no `http2`
    # — ALPN/h2 would confound the comparison), resumption fully disabled so
    # every connection pays a FULL handshake.
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_requests 100000;

    # The purge API (POST /__dpc/purge + Surrogate-Key header; /purge/<tag>;
    # /purge_all) — the only place purges can come from. Left open for e2e;
    # restrict in real deployments (allow/deny and/or $dpc_purge_token).
    location /__dpc/ {
      content_by_lua_block { require("purge").purge() }
    }

    # Known-uncacheable prefix gets a cache-free location. Without this,
    # proxy_cache_lock + a no-store response = waiting requests stall for
    # proxy_cache_lock_timeout (5 s default) — measured; see SPEC bench notes.
    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://app_upstream;
    }

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      # No proxy_cache_valid: the app's `s-maxage` drives freshness.
      # MUST mirror purge.lua's cache_key().
      proxy_cache_key $uri$is_args$args;
      set $skip_cache 0;
      set $dpc_cache_status "";
      # Flags purged-but-not-yet-refreshed keys for the bypass below.
      rewrite_by_lua_block { require("purge").rewrite() }
      proxy_cache_bypass $skip_cache;
      # Honest client-visible status: unknown-key refreshes read MISS,
      # BYPASS means exactly "a purge evicted this".
      header_filter_by_lua_block { require("purge").header_filter() }
      log_by_lua_block { require("purge").log() }
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $dpc_cache_status;
      # Don't leak the tags to clients: Surrogate-Key carries schema names and
      # row IDs. log() reads the tags from $upstream_http_surrogate_key, which
      # proxy_hide_header leaves untouched, so purging still works.
      proxy_hide_header Surrogate-Key;
      proxy_pass http://app_upstream;
    }
  }
}
