# nginx-ls pairing: plain nginx speaking the LiteSpeed Cache dialect via
# nginx/purge_litespeed.lua (repo root, mounted at /dpc). The app runs the
# drizzle-page-cache/litespeed entrypoint UNCHANGED — the same headers
# WordPress's LiteSpeed Cache plugin emits (X-LiteSpeed-Tag /
# -Cache-Control / -Purge riding responses through the proxy) drive
# tagging and invalidation here. Verify-only pairing: no TLS listener, not
# a bench target.
load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

user nginx;
worker_processes auto;
pid /run/nginx.pid;
events {
  worker_connections 8192;
}

http {
  access_log off;

  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=60m;

  # Purge state for nginx/purge_litespeed.lua (same dicts as purge.lua).
  lua_shared_dict dpc_tags 4m;
  lua_shared_dict dpc_keys 16m;
  lua_package_path "/dpc/?.lua;;";

  # Store ONLY what X-LiteSpeed-Cache-Control marks public — and never
  # ESI responses (nginx cannot assemble them; keep ESI off in LSCWP).
  map $upstream_http_x_litespeed_cache_control $dpc_ls_nostore {
    default 1;
    "~*(no-cache|no-store|private|esi=on)" 1;
    "~*public" 0;
  }

  upstream app_upstream {
    server app-nginx-ls:8000;
    keepalive 32;
  }

  server {
    listen 80;
    keepalive_requests 100000;

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      # MUST mirror purge_litespeed.lua's cache_key().
      proxy_cache_key $uri$is_args$args;
      # Freshness comes from X-LiteSpeed-Cache-Control, which nginx can't
      # read (the app's browser-facing Cache-Control may even forbid
      # caching) — ignore those and store for a ceiling; the Lua key
      # record expires with the page's real max-age and forces a refresh.
      proxy_ignore_headers Cache-Control Expires;
      proxy_cache_valid 200 301 302 8d;
      set $skip_cache 0;
      set $dpc_cache_status "";
      rewrite_by_lua_block { require("purge_litespeed").rewrite() }
      # _lscache_vary is the cookie LSCWP sets for logged-in users: never
      # serve them from (or store them into) the public cache.
      proxy_cache_bypass $skip_cache $cookie__lscache_vary;
      proxy_no_cache $dpc_ls_nostore $cookie__lscache_vary;
      # Executes X-LiteSpeed-Purge headers riding any response, then
      # publishes the honest client-visible status.
      header_filter_by_lua_block { require("purge_litespeed").header_filter() }
      log_by_lua_block { require("purge_litespeed").log() }
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $dpc_cache_status;
      # LiteSpeed strips its control headers; do the same (the Lua reads
      # the $upstream_http_* copies, which proxy_hide_header leaves alone).
      proxy_hide_header X-LiteSpeed-Cache-Control;
      proxy_hide_header X-LiteSpeed-Tag;
      proxy_hide_header X-LiteSpeed-Purge;
      proxy_pass http://app_upstream;
    }
  }
}
