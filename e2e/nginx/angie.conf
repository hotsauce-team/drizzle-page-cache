# Angie pairing (identical proxy tuning to nginx.conf — Angie is a drop-in
# fork). Unlike the nginx pairing, this one exercises the purge loop: Angie's
# official cache-purge module (the ngx_cache_purge lineage, preinstalled in
# the official image) accepts PURGE requests with a trailing `*` wildcard,
# and the app maps tags to URL patterns via `angiePurger`.
load_module modules/ngx_http_cache_purge_module.so;

worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;

  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=10m;

  upstream app_upstream {
    server app-angie:8000;
    keepalive 32;
  }

  server {
    listen 80;
    # TLS listener for the handshake-stress bench (see nginx.conf comment).
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_requests 100000;

    # Known-uncacheable prefix gets a cache-free location (see nginx.conf
    # comment — avoids proxy_cache_lock stalls on no-store responses).
    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://app_upstream;
    }

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      # REQUIRED for purging: the purge module reads the location's compiled
      # cache-key value — relying on the implicit default key makes every
      # PURGE a silent 412. The variable part must sit at the END of the key
      # so a trailing `*` prefix-match aligns (this is the key from Angie's
      # own module docs).
      proxy_cache_key $uri$is_args$args;
      # PURGE method purges the cache key of the request URI; a trailing `*`
      # prefix-purges every matching entry (query-string variants included,
      # since $is_args$args is part of the key). e2e-only `from all` —
      # restrict to the app's address in real deployments.
      proxy_cache_purge PURGE from all;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_pass http://app_upstream;
    }
  }
}
