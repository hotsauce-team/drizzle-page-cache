# Angie pairing (identical proxy tuning to nginx.conf — Angie is a drop-in
# fork). Purging runs the same Lua tag transport as the nginx pairing
# (see nginx/purge.lua at the repo root, mounted at /dpc) via Angie's
# official lua module (angie-module-lua, bundled in the full image; ndk
# must load first).
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;

  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=10m;

  # Purge state for nginx/purge.lua. dpc_tags must not evict (an evicted
  # purge record can serve stale — size generously; entries self-expire);
  # dpc_keys eviction only costs an extra bypass.
  lua_shared_dict dpc_tags 4m;
  lua_shared_dict dpc_keys 16m;
  lua_package_path "/dpc/?.lua;;";

  upstream app_upstream {
    server app-angie:8000;
    keepalive 32;
  }

  server {
    listen 80;
    # TLS listener for the handshake-stress bench (see nginx.conf comment).
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_requests 100000;

    # The purge API — the only place purges can come from (see nginx.conf
    # comment). Left open for e2e; restrict in real deployments.
    location /__dpc/ {
      content_by_lua_block { require("purge").purge() }
    }

    # Known-uncacheable prefix gets a cache-free location (see nginx.conf
    # comment — avoids proxy_cache_lock stalls on no-store responses).
    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://app_upstream;
    }

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      # MUST mirror purge.lua's cache_key().
      proxy_cache_key $uri$is_args$args;
      set $skip_cache 0;
      set $dpc_cache_status "";
      # Flags purged-but-not-yet-refreshed keys for the bypass below.
      rewrite_by_lua_block { require("purge").rewrite() }
      proxy_cache_bypass $skip_cache;
      # Honest client-visible status: unknown-key refreshes read MISS,
      # BYPASS means exactly "a purge evicted this".
      header_filter_by_lua_block { require("purge").header_filter() }
      log_by_lua_block { require("purge").log() }
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $dpc_cache_status;
      proxy_pass http://app_upstream;
    }
  }
}
