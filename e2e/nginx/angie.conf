# Bench-only pairing (identical tuning to nginx.conf — Angie is a drop-in
# fork). Angie DOES have an official cache-purge module (exact + wildcard
# PURGE) — not exercised here; this measures the cache-hit path.
worker_processes auto;
events {
  worker_connections 8192;
}

http {
  access_log off;

  proxy_cache_path /dev/shm/pagecache levels=1:2 keys_zone=pub:64m
                   max_size=200m inactive=10m;

  upstream app_upstream {
    server app:8000;
    keepalive 32;
  }

  server {
    listen 80;
    # TLS listener for the handshake-stress bench (see nginx.conf comment).
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_requests 100000;

    # Known-uncacheable prefix gets a cache-free location (see nginx.conf
    # comment — avoids proxy_cache_lock stalls on no-store responses).
    location /admin/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://app_upstream;
    }

    location / {
      proxy_cache pub;
      proxy_cache_lock on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_pass http://app_upstream;
    }
  }
}
