name: drizzle-page-cache-e2e

# Pairings in order of preference (see BENCHMARKS.md conclusions):
# 1. OpenLiteSpeed  2. Caddy+Souin (Deno/Node/Bun)  3. Varnish+Hitch
# 4. Angie  5. nginx

services:
  app:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  # -- 1. OpenLiteSpeed (header-driven purging) -------------------------------

  app-ols:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_STYLE=litespeed
      - PURGE_SITE=http://ols
      - PURGE_TOKEN=e2e-secret
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  ols:
    build:
      context: .
      dockerfile: Dockerfile.ols
    shm_size: 256m # cache storagepath lives on /dev/shm (in-memory)
    volumes:
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:18083:80"
    depends_on:
      app-ols:
        condition: service_healthy

  # -- 2. Caddy + Souin (Surrogate-Key API; Deno, Node, and Bun apps) ---------

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    # Runs on caddy.json (generated from the Caddyfile, then patched): souin's
    # FromApp never copies the global `api` block into the handler config, so
    # the Souin API cannot be enabled from a Caddyfile. See SPEC.md.
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      # Host ports live in 1808x: the 808x range is routinely occupied by
      # other dev services. The harness itself never uses host ports (verify
      # and bench run on the compose network) — these exist for manual poking.
      - "127.0.0.1:18088:80"
    depends_on:
      app:
        condition: service_healthy

  # Same app on Node 24+ (native type stripping + node:sqlite). The repo is
  # mounted read-only, so it is copied to /tmp where a root package.json
  # ({"type":"module"}) and node_modules (drizzle-orm) can exist.
  app-node:
    image: node:24-alpine
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_SITE=http://caddy-node
    command: >
      sh -c "cp -r /repo /tmp/pkg && cd /tmp/pkg
      && printf '{\"type\":\"module\"}' > package.json
      && npm install --no-save 'drizzle-orm@^0.45.1' --loglevel=error
      && exec node e2e/app/server-node.ts"
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 40

  caddy-node:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app-node:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      app-node:
        condition: service_healthy

  # Same app on Bun (container-only; Bun is never run on the host). Same
  # read-only-mount workaround as app-node.
  app-bun:
    image: oven/bun:alpine
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_SITE=http://caddy-bun
    command: >
      sh -c "cp -r /repo /tmp/pkg && cd /tmp/pkg
      && printf '{\"type\":\"module\"}' > package.json
      && bun add 'drizzle-orm@^0.45.1' --silent
      && exec bun e2e/app/server-bun.ts"
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 40

  caddy-bun:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app-bun:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      app-bun:
        condition: service_healthy

  # -- 3. Varnish + Hitch (bench-only: xkey purger exists, loop not paired) ---

  # Varnish (cache, no TLS) + hitch (TLS termination, PROXY protocol into
  # varnish). The classic split-process stack.
  varnish:
    image: varnish:latest
    command: >
      varnishd -F -f /etc/varnish/default.vcl -s malloc,256m
      -a http=:80,HTTP -a proxy=:8443,PROXY
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "127.0.0.1:18086:80"
    depends_on:
      app:
        condition: service_healthy

  hitch:
    image: hitch:latest
    # --workers: hitch defaults to ONE worker — parity with the other
    # servers requires matching the core count.
    command: >
      hitch --backend=[varnish]:8443 --frontend=[0.0.0.0]:443
      --write-proxy-v2=on --alpn-protos=http/1.1 --workers=6
      --user hitch --group hitch /certs/hitch.pem
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - varnish

  # -- 4. Angie (tag purging via nginx/purge.lua) ------------------------------

  # Same app again for the Angie pairing (nginx/purge.lua via Angie's
  # official lua module, bundled in the full image).
  app-angie:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_STYLE=angie
      - PURGE_SITE=http://angie
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  angie:
    image: docker.angie.software/angie:latest
    shm_size: 256m
    volumes:
      - ./nginx/angie.conf:/etc/angie/angie.conf:ro
      - ../nginx:/dpc:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:18085:80"
    depends_on:
      app-angie:
        condition: service_healthy

  # -- 5. nginx (tag purging via nginx/purge.lua) ------------------------------

  # Free nginx has no tag support, but the distro's lua-nginx-module
  # package (nginx-mod-http-lua) runs nginx/purge.lua: PURGE requests mark
  # tags stale and proxy_cache_bypass refreshes matching keys on the next hit.
  app-nginx:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_STYLE=nginx
      - PURGE_SITE=http://nginx
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    shm_size: 256m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx:/dpc:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:18084:80"
    depends_on:
      app-nginx:
        condition: service_healthy

  # -- 6. nginx-ls (plain nginx speaking the LiteSpeed Cache dialect) ---------

  # nginx/purge_litespeed.lua makes plain nginx understand X-LiteSpeed-Tag /
  # -Cache-Control / -Purge — the headers WordPress's LiteSpeed Cache plugin
  # emits. Dogfooded here with the litespeed entrypoint UNCHANGED (same app
  # config as the OLS pairing, different proxy). Verify-only, not benched.
  app-nginx-ls:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_STYLE=litespeed
      - PURGE_SITE=http://nginx-ls
      - PURGE_TOKEN=e2e-secret
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  nginx-ls:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    shm_size: 256m
    volumes:
      - ./nginx/nginx-ls.conf:/etc/nginx/nginx.conf:ro
      - ../nginx:/dpc:ro
    ports:
      - "127.0.0.1:18087:80"
    depends_on:
      app-nginx-ls:
        condition: service_healthy
