name: drizzle-page-cache-e2e

services:
  app:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  # Same app on Node 24+ (native type stripping + node:sqlite). The repo is
  # mounted read-only, so it is copied to /tmp where a root package.json
  # ({"type":"module"}) and node_modules (drizzle-orm) can exist.
  app-node:
    image: node:24-alpine
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_URL=http://caddy-node/souin-api/souin
    command: >
      sh -c "cp -r /repo /tmp/pkg && cd /tmp/pkg
      && printf '{\"type\":\"module\"}' > package.json
      && npm install --no-save 'drizzle-orm@^0.45.1' --loglevel=error
      && exec node e2e/app/server-node.ts"
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 40

  # Same app on Bun (container-only; Bun is never run on the host). Same
  # read-only-mount workaround as app-node.
  app-bun:
    image: oven/bun:alpine
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_URL=http://caddy-bun/souin-api/souin
    command: >
      sh -c "cp -r /repo /tmp/pkg && cd /tmp/pkg
      && printf '{\"type\":\"module\"}' > package.json
      && bun add 'drizzle-orm@^0.45.1' --silent
      && exec bun e2e/app/server-bun.ts"
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 40

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    # Runs on caddy.json (generated from the Caddyfile, then patched): souin's
    # FromApp never copies the global `api` block into the handler config, so
    # the Souin API cannot be enabled from a Caddyfile. See SPEC.md.
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy

  caddy-node:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app-node:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      app-node:
        condition: service_healthy

  # Same app again for the OpenLiteSpeed pairing (header-driven purging).
  app-ols:
    image: denoland/deno:alpine
    working_dir: /repo
    volumes:
      - ../:/repo:ro
    environment:
      - PURGE_STYLE=litespeed
      - PURGE_URL=http://ols/__drizzle-page-cache/purge
      - PURGE_TOKEN=e2e-secret
    command: deno run --allow-net --allow-env /repo/e2e/app/server.ts
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1",
      ]
      interval: 3s
      timeout: 2s
      retries: 30

  ols:
    build:
      context: .
      dockerfile: Dockerfile.ols
    shm_size: 256m # cache storagepath lives on /dev/shm (in-memory)
    volumes:
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      app-ols:
        condition: service_healthy

  # Bench-only pairings (no tag purging exercised): nginx as the raw
  # reference, Angie as the nginx fork with purge/keyval modules available.
  nginx:
    image: nginx:alpine
    shm_size: 256m
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      app:
        condition: service_healthy

  angie:
    image: docker.angie.software/angie:latest
    shm_size: 256m
    volumes:
      - ./nginx/angie.conf:/etc/angie/angie.conf:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      app:
        condition: service_healthy

  caddy-bun:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    environment:
      - UPSTREAM=app-bun:8000
    volumes:
      - ./caddy.json:/etc/caddy/caddy.json:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      app-bun:
        condition: service_healthy

  # Bench-only pairing: Varnish (cache, no TLS) + hitch (TLS termination,
  # PROXY protocol into varnish). The classic split-process stack.
  varnish:
    image: varnish:latest
    command: >
      varnishd -F -f /etc/varnish/default.vcl -s malloc,256m
      -a http=:80,HTTP -a proxy=:8443,PROXY
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      app:
        condition: service_healthy

  hitch:
    image: hitch:latest
    # --workers: hitch defaults to ONE worker — parity with the other
    # servers requires matching the core count.
    command: >
      hitch --backend=[varnish]:8443 --frontend=[0.0.0.0]:443
      --write-proxy-v2=on --alpn-protos=http/1.1 --workers=6
      --user hitch --group hitch /certs/hitch.pem
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - varnish

  # Bench-only pairing: Envoy with the alpha HTTP cache filter (no purge
  # mechanism exists for it — cannot join the tag-purge e2e).
  envoy:
    image: envoyproxy/envoy:v1.33-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:8087:80"
    depends_on:
      app:
        condition: service_healthy
