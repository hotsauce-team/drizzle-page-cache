name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# id-token is needed for OIDC: npm trusted publishing + provenance
# (and JSR provenance, when re-enabled)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish from main branch
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          # Check if the tagged commit is on main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "❌ Tag must be on main branch"
            echo "   Tagged commit: $GITHUB_SHA"
            echo "   Branches containing this commit:"
            git branch -r --contains "$GITHUB_SHA"
            exit 1
          fi
          echo "✅ Tag is on main branch"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify version consistency
        run: |
          # Extract version from git tag (strip 'v' prefix)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          PKG_VERSION=$(grep -o '"version": "[^"]*"' deno.json | cut -d'"' -f4)
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch in deno.json"
            echo "   Expected: $TAG_VERSION"
            echo "   Found: $PKG_VERSION"
            exit 1
          fi
          echo "✅ deno.json version matches tag $TAG_VERSION"

      - name: Typecheck
        run: deno task check

      - name: Run tests
        run: deno task test

      # JSR publishing is on hold — uncomment to re-enable (the JSR scope
      # @hotsauce and deno.json are already set up for it).
      # - name: Publish @hotsauce/drizzle-page-cache
      #   run: deno publish

  publish-npm:
    runs-on: ubuntu-latest
    # Reuse the gate job's checks (tag on main, version match, typecheck, tests)
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no token is used —
      # auth comes from the trusted publisher configured on npmjs.com.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Build npm package
        run: deno task build:npm

      - name: Publish drizzle-page-cache
        run: npm publish
        working-directory: npm
